; Favilla KEY — STM32G0B1KBU6 isolated Nostr signer
;   pio run -t upload   (STLINK-V3SET on the Tag-Connect), or flash
;   .pio/build/g0/firmware.elf with STM32CubeProgrammer.
[env:g0]
platform  = ststm32@20.0.0      ; reproducible builds (23 Nov 2026): exact versions, as the bench PC resolved them
platform_packages =
    platformio/toolchain-gccarmnoneeabi@1.70201.0
    platformio/framework-stm32cubeg0@1.6.3
board     = nucleo_g0b1re          ; same G0B1 die; -DSTM32G0B1xx, cortex-m0plus, HAL
framework = stm32cube
board_upload.maximum_size     = 120832   ; 28 Oct 2026 Emberwill: 118 KB. Three more 2 KB pages
                                          ; below the seed page hold the Emberwill plan
                                          ; (0x0801E800) and its two state pages
                                          ; (0x0801E000, 0x0801D800), src/ember_store.h.
                                          ; v5.1 (was 126976 = 124 KB): the last two 2 KB pages
                                          ; are the seed store (0x0801F000) and the
                                          ; key store (0x0801F800), src/key_store.c.
                                          ; Capping the image here makes it
                                          ; impossible for firmware to grow into
                                          ; them. If you raise this, move
                                          ; SS_PAGE_ADDR / KS_PAGE_ADDR too.
board_upload.maximum_ram_size = 147456
upload_protocol = stlink
debug_tool      = stlink
build_flags =
    -Os -Wall              ; v16: -flto taken out again 7 Nov 2026 (first v16 flash: G0 silent on I2C; LTO can bind the HAL's weak I2C callbacks over ours). Fits without it.
    -Iinclude
    ; secp256k1 config must match lib/secp256k1/library.json (headers are
    ; included from main.c too, so the table-size macros must agree)
    -DECMULT_WINDOW_SIZE=2 -DCOMB_BLOCKS=2 -DCOMB_TEETH=5
    -DENABLE_MODULE_EXTRAKEYS=1 -DENABLE_MODULE_SCHNORRSIG=1 -DENABLE_MODULE_ECDH=1 -DENABLE_MODULE_RECOVERY=1
    -DUSE_EXTERNAL_DEFAULT_CALLBACKS=1

; Short-fuse BENCH image for the mainnet lifecycle test (28 Oct 2026): Quiet 12,
; Afterglow 6 + 1 h, RBF 3. Same code, different constants. Never freeze or ship.
[env:g0_fuse]
extends = env:g0
build_flags = ${env:g0.build_flags} -DEMBER_BENCH_FUSE
