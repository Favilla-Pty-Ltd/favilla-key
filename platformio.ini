build_flags =
    ${common.base_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFAVILLA_RELEASE=1
    -DARDUINO_USB_MODE=0
    -DFAVILLA_FIDO_PROBE
    -DFAVILLA_PASSKEY_DOOR
    -DFAVILLA_PK_RESTORABLE
    -DFAVILLA_BLE_KBD
    -Wl,--wrap=esp_bt_controller_init
    -Wl,--wrap=ble_gap_adv_start
    -Wl,--wrap=esp_panic_handler
    -DFAVILLA_RF_TEST=1

