; ============================================================================
;  Favilla KEY — PlatformIO build
;
;  REPRODUCIBILITY: see PINNING.md. Everything that can change the binary is
;  pinned; this file records WHAT and the sidecar records WHEN and to WHICH
;  version, so a future bump is visibly deliberate rather than drift.
; ============================================================================

[platformio]
; 2 Oct 2026: the light-sleep build is the main one. The VS Code toolbar
; Build/Upload buttons and a bare `pio run` use this env; the stock
; favilla_key env is still there as the no-light-sleep fallback
; (`pio run -e favilla_key -t upload`).
default_envs = favilla_key_pm

; 11u (11 Nov 2026): the base flags live here so an env can take them WITHOUT
; -DARDUINO_USB_CDC_ON_BOOT=1 (the pmv env needs =0, and a core-rebuild env
; sees build_flags but not build_unflags, so both values would be passed and
; -Werror parts of the IDF fail on the redefinition; see favilla_key_fido_pm).
[common]
base_flags =
    ; ===== ROOT FIX: WiFi + lwIP buffers in PSRAM =====
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=1
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -DCONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096

    ; ===== ArduinoJson: 4-byte string lengths (7 Oct 2026) =====
    ; Default is 2 bytes = 65,535 chars per string. A NIP-46 sign_event for a
    ; kind:3 contact list carries a ~130 KB base64 "content" field in the
    ; envelope and a ~100 KB inner-event string in params[0]; both failed to
    ; parse ("JSON parse failed or wrong format"). Costs 2 bytes per string
    ; node. Header-only library, so a flag is the right place.
    -DARDUINOJSON_STRING_LENGTH_SIZE=4

    ; ===== TFT_eSPI (Favilla KEY V1.1) =====
    ; Configured ENTIRELY through flags with USER_SETUP_LOADED=1 — there is no
    ; hand-edited User_Setup.h inside .pio/libdeps. That matters more than the
    ; version pin: a build that depends on an edited file in a regenerated
    ; directory does not reproduce from a clean checkout at all.
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=15
    -DTFT_SCLK=16
    -DTFT_CS=17
    -DTFT_DC=18
    -DTFT_RST=7
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000
    -DUSE_HSPI_PORT=1

    ; ===== misc =====
    -DCORE_DEBUG_LEVEL=0

    ; ===== Hardening (17 Sep 2026) =====
    ; Stack canaries on every function with a stack buffer, across our code
    ; AND the vendored libs (TFT_eSPI, ArduinoJson, WebSockets). The prebuilt
    ; IDF/Arduino libs are untouched (fixed sdkconfig, no canaries there);
    ; src/stack_guard.cpp supplies __stack_chk_guard / __stack_chk_fail.
    ; A smashed return address aborts and reboots instead of jumping.
    ; NOTE: sdkconfig.defaults is INERT in an Arduino-framework build (no
    ; generated sdkconfig has ever existed for this project) — IDF-level
    ; options cannot be set from that file; app-level ones go here.
    -fstack-protector-strong

    ; ===== Radio choke point (4 Nov 2026) =====
    ; Every creation of the WiFi driver goes through __wrap_esp_wifi_init in
    ; main.cpp, which refuses it in a Bitcoin, PASSKEY or air-gap life. Found
    ; on the bench: the WIFI menu could join a network in an offline life.
    -Wl,--wrap=esp_wifi_init

    -std=gnu++17

    ; ===== byte-identical across MACHINES =====
    ; Source paths are mapped to fixed names (-ffile-prefix-map, in
    ; scripts/build_epoch.py), the build time is the commit's time
    ; (SOURCE_DATE_EPOCH), and the core rebuild's components are pinned
    ; (dependencies.lock, scripts/pin_hybrid.py). Reference build: docker/.

[env:favilla_key]
; 11bw (issue #40 B6): the build carries the commit's time, not the clock (scripts/build_epoch.py)
extra_scripts = pre:scripts/build_epoch.py
; Pinned to an exact release ARCHIVE, not a caret range — this one line fixes
; the ESP-IDF, the Arduino core AND the GCC toolchain together. A range here
; would swap the compiler between builds and change the binary with no source
; change at all.
;
; The URL is not enough on its own: a GitHub release asset can be replaced or
; deleted. Verified 5 Aug 2026 —
;   sha256 465767188e58eb39156357ac6c9b7a01d21c3b18042214773f8b5ea8e8b7ae41
;   size   1,632,095 bytes
; Keep an archived copy alongside the release tag. If that URL ever 404s the
; build is not merely un-reproducible, it is impossible.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.33/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

; ---- FORCE N16R8: 16MB flash + 8MB OPI PSRAM (was resolving to N8/No-PSRAM) ----
board_build.arduino.memory_type = qio_opi
board_build.flash_mode  = qio
board_build.psram_type  = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions  = partitions_favilla_16mb.csv
; filesystem removed: fonts are embedded in the signed image (src/fonts_data.h).
; No LittleFS partition, no `pio run -t uploadfs`, no unsigned flash to poison.

; 921600 for the entropy-dump build: it moves ~2x the dump size as hex over
; the wire, so 115200 turns a 12-second dump into a 90-second one. Safe to
; leave raised — upload_speed is already 921600.
monitor_speed = 921600
upload_speed  = 921600

; ---- Libraries: ONLY these. Do NOT let the LDF chase deep dependencies. ----
lib_ldf_mode = chain
lib_compat_mode = strict

; NO lib_deps. All three libraries are VENDORED in lib/ and committed:
;
;   lib/WebSockets_Generic   2.16.1   (already was)
;   lib/TFT_eSPI             2.5.43   (vendored 5 Aug 2026)
;   lib/ArduinoJson          7.0.0    (vendored 5 Aug 2026)
;
; `bodmer/TFT_eSPI @ 2.5.43` was already an exact version, not a range — but it
; still meant "whatever the PlatformIO registry serves for that version", and
; the registry is not content-addressed: a tag can be republished. Vendoring
; makes the source part of this repo, so the only way the library changes is a
; commit you can see in the log. It also makes an offline build work.
;
; Provenance and hashes are in PINNING.md. To bump a version, replace the tree
; from the upstream tag, verify the hash, and record it there in the same commit
; — that is the whole point: a bump should be visible, not silent.
;
; Trimmed on vendoring: examples/, docs/, Tools/, extras/, CI config. Nothing
; the build includes. Verified by walking every #include in both trees — the
; only unresolved one is TFT_eSPI's Extensions/AA_graphics.cpp, which does not
; exist in the upstream 2.5.43 release either and is guarded by #ifdef
; AA_GRAPHICS, which this build does not define.

build_flags =
    ${common.base_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

build_unflags = -std=gnu++11

; ---- Warnings on OUR code only ----------------------------------------------
; Deliberately build_src_flags, NOT build_flags: build_flags would also apply
; to TFT_eSPI, ArduinoJson and the Arduino core, burying real findings under
; thousands of warnings from code you don't own.
;
; ENABLED 5 Aug 2026. The note here used to say "after Test A" — Test A passed
; on 31 July, so this was overdue. Expect a large first batch given the size of
; main.cpp: triage once, then keep it clean. Its value is catching the NEXT
; defect, not this batch. Warnings do not fail the build (no -Werror), so a
; noisy first run costs nothing but reading time.
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter        ; Arduino callback signatures trip this constantly
    ; ---- BENCH ONLY (16 Sep 2026): RCE simulation at the BITCOIN door -------
    ; Makes the ESP32 behave like a compromised one: skips its own G0 presence
    ; check, ignores the G0's MODEBTC answer, ignores the latch verify, and
    ; attempts the seed unwrap anyway. Only the SE can refuse it. With the G0's
    ; SDA/SCL pulled the log must end in "SW aes_unwrap = 6986" and no wallet;
    ; with the G0 connected the same build opens normally. Every skipped gate
    ; logs a "[BENCH] RCE_SIM:" line.
    ; REMOVE THIS LINE AND REBUILD before the unit leaves the bench — it is a
    ; build that ignores its own safety checks on purpose.
    ; ---- BOARD SELECT (24 Sep 2026) -----------------------------------------
    ; KeyV4 PCBA: INA232 (0x40) in place of the MAX17048 (0x36), LIS2DW12
    ; (0x18) in place of the BMA400 (0x14). Selects src/ina232.h and
    ; src/lis2dw12.h in main.cpp; everything else is board-blind. Remove this
    ; one line to build for a V3 board.
    -DFAVILLA_BOARD_V4
    ; ---- SE051 ENA deep power-down (13 Oct 2026) -----------------------------
    ; Boards with SE051 ENA (pin 11) driven from G0 PB2, pin 17 (R33 1M pull-up, 3V3->VIN,
    ; VOUT->VCC). goSleep() sends the G0 SLEEPDEEP (Stop + ENA low) instead of
    ; the T=1 power-down, and setup() wakes the G0 / waits for the SE before the
    ; first se_init(). Needs G0 firmware with SELFTEST v6 (SEPWR/SLEEPDEEP).
    ; Remove this line for a board without the ENA trace (SE stays on 3V3).
    -DFAVILLA_SE_ENA

; ---- sdkconfig.defaults --------------------------------------------------------
; CORRECTION 17 Sep 2026: with framework = arduino on pioarduino, sdkconfig.defaults
; is NOT read at all — the Arduino core ships prebuilt IDF libraries with a fixed
; sdkconfig, and no sdkconfig.favilla_key has ever been generated for this project
; (recursive search). The earlier "delete the generated file" note was wrong: the
; WiFi-buffer, lwIP and CONFIG_PM_ENABLE lines in that file have never applied.
; PSRAM/flash come from the board_build.* lines above. To change IDF-level options
; the build would need pioarduino's `custom_sdkconfig` hybrid compile (rebuilds the
; Arduino libs, long first build); app-level hardening goes in build_flags.
; ============================================================================
;  favilla_key_pm — PM BRANCH (2 Oct 2026): automatic light sleep
;
;  Identical to favilla_key except the Arduino core is rebuilt with ESP-IDF
;  power management on (pioarduino "hybrid compile"). The first build
;  recompiles the IDF libraries — 10-20 min and a few GB under .platformio;
;  later builds are normal. Flash with:  pio run -e favilla_key_pm -t upload
;
;  What the options do:
;    PM_ENABLE + TICKLESS_IDLE   the scheduler light-sleeps whenever every task
;                                is blocked; esp_pm_configure() in pmInit() turns
;                                it on at boot (80 MHz max / 40 min / sleep on)
;    IDLE_TIME_BEFORE_SLEEP=3    sleep for any gap over 3 ms (10 blocked the menu
;                                loops, whose idle gaps are exactly 10 ms)
;    *_IRAM_OPT                  sleep/wake code in IRAM (faster wake, less flash
;                                traffic right after wake)
;    ESP_PHY_MAC_BB_PD           power down WiFi MAC/baseband during light sleep -
;                                REMOVED 2 Oct 2026: the station dropped the home router
;                                (wl=1, reconnect hunt at 120 mA) with it on. Re-try once
;                                the link is proven stable without it.
;    *_LEAKAGE_WORKAROUND        drive the flash/PSRAM CS lines in sleep so the
;                                octal PSRAM doesn't leak through floating pins
;    PM_POWER_DOWN_CPU           CPU power domain off in light sleep (S3 supports)
;
;  The core is rebuilt locally; its components are pinned by dependencies.lock
;  and scripts/pin_hybrid.py (24 Nov 2026), so these hashes are reproducible.
; ============================================================================
[env:favilla_key_pm]
extends = env:favilla_key
custom_sdkconfig =
; 19 Oct 2026 (review F7): no core dumps at all on the rebuilt core. The
; partition table has no coredump partition either; this makes it explicit.
    CONFIG_ESP_COREDUMP_ENABLE_TO_NONE=y
    CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=n
; 20 Oct 2026: mbedTLS allocations in PSRAM, not internal RAM. The core's
; default (INTERNAL_MEM_ALLOC) put each relay TLS session's buffers in internal
; RAM, which left ~27 KB free during bunker sessions; the NIP-46 decrypt guard
; (needs ~30 KB) then answered "busy: low memory" to DM decrypts. Relay traffic
; is NIP-44 ciphertext and no signing key lives on this processor (G0 + SE), so
; external RAM is acceptable here; the boot RAM scrub covers PSRAM.
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
    CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=n
; 20 Oct 2026: WiFi + lwIP buffers in PSRAM. The "ROOT FIX" lines for this in
; build_flags (-DCONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=1 etc.) never applied:
; sdkconfig options set as -D flags do nothing to the prebuilt or rebuilt
; core. This is where they take effect. Bench: bunker sessions sat at ~29 KB
; internal free and Nostrich DM decrypts were refused on every retry.
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
; 30 Oct 2026: THESE THREE LINES HAVE NO EFFECT - the rebuilt core still has no
; TinyUSB (checked after the rebuild). Left in place only because editing
; custom_sdkconfig forces another core rebuild; remove them at the next one.
; Original note, 29 Oct 2026: TinyUSB kept ON in the rebuilt core. The stock 3.3.3 libs have
; CONFIG_TINYUSB_ENABLED / _CDC_ENABLED / _HID_ENABLED = 1 (checked in the
; reinstalled package), but the light-sleep rebuild came out without the CDC
; port: the FIDO env (ARDUINO_USB_MODE=0) failed "USBSerial was not declared".
; The shipping envs keep ARDUINO_USB_MODE=1 (USB-Serial/JTAG), so having
; TinyUSB compiled into the core changes nothing at runtime for them.
    CONFIG_TINYUSB_ENABLED=y
    CONFIG_TINYUSB_CDC_ENABLED=y
    CONFIG_TINYUSB_HID_ENABLED=y
    CONFIG_PM_ENABLE=y
    CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
    CONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=3
    CONFIG_PM_POWER_DOWN_CPU_IN_LIGHT_SLEEP=y
    CONFIG_ESP_SLEEP_PSRAM_LEAKAGE_WORKAROUND=y
    CONFIG_ESP_SLEEP_FLASH_LEAKAGE_WORKAROUND=y
    CONFIG_ESP_SLEEP_GPIO_RESET_WORKAROUND=y
; 4 Oct 2026: internal-SRAM givebacks. On the S3, IRAM and DRAM share one
; pool, so every sleep/idle/Wi-Fi-sleep routine placed in IRAM is heap lost;
; MAC_BB_PD also allocates a MAC/baseband backup buffer in internal DMA RAM.
; The camera needs a >= 40 KB contiguous internal block at scan time and the
; bunker's TLS socket ~27 KB; the PM build had squeezed the largest block to
; ~59 KB with Wi-Fi up. These buy microseconds of sleep latency, nothing in
; milliamps. PM_SLP_IRAM_OPT and POWER_DOWN_CPU are ON in pioarduino's base
; config, so the first needs an explicit =n (the second is kept: real saving).
; MAC_BB_PD was never proven to save anything and once dropped the router
; link; off until there is a reason to A/B it again.
    CONFIG_PM_SLP_IRAM_OPT=n
    CONFIG_PM_RTOS_IDLE_OPT=n
    CONFIG_ESP_WIFI_SLP_IRAM_OPT=n
    CONFIG_PM_PROFILING=n
    CONFIG_ESP_PHY_MAC_BB_PD=n
; 27 Oct 2026: Secure Boot V2 compiled INTO THE BOOTLOADER. The stock pioarduino
; bootloader has no secure-boot code, so after the station burned the three
; DEV1 digests the board stayed "Secure Boot: Disabled" (the bootloader is what
; burns SECURE_BOOT_EN on its first clean boot). BUILD_SIGNED_BINARIES=n leaves
; bootloader.bin and firmware.bin UNSIGNED: the Manufacturing Station signs
; both with the ceremony key (espsecure), never the build machine. The app
; side of this option only adds the signature-block checks the bootloader
; relies on. Dev boards that never had digests burned still boot these images.
    CONFIG_SECURE_BOOT=y
    CONFIG_SECURE_BOOT_V2_ENABLED=y
    CONFIG_SECURE_BOOT_BUILD_SIGNED_BINARIES=n
; 7 Oct 2026: pioarduino 55.03.33's idf_lib_copy() moves the rebuilt archives
; and memory.ld into the core-libs package but NOT the generated sections.ld,
; so the first build after a core rebuild links (it finds the script in
; .pio/build) and every later one links PM-built archives against the STOCK
; esp32s3/qio_opi/sections.ld: "orphan section .text.vApplicationSleep" +
; "dangerous relocation: l32r" in libesp_pm.a. Upstream #532 / #534. The
; script copies the generated sections.ld into the package after the link;
; a no-op on ordinary builds. Project-side on purpose: the platform archive
; stays byte-for-byte the pinned one.
; Also from that function: it DELETES dependencies.lock after a core rebuild,
; so a missing lock after a hybrid build is pioarduino, not drift - re-commit it.
extra_scripts =
    pre:scripts/build_epoch.py
    pre:scripts/pin_hybrid.py
    post:scripts/hybrid_sections_ld.py
    post:scripts/guard_real_app.py
; Components the Arduino core bundles that this firmware never uses. Dropping
; them from the hybrid compile fixes the lib builder tripping over RainMaker /
; Insights embedded certificate files (https_server.crt.S not found) and cuts
; the rebuild time. esp32-camera is deliberately NOT in this list.
custom_component_remove =
    espressif/esp_hosted
    espressif/esp_wifi_remote
    espressif/esp-dsp
    espressif/network_provisioning
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/cbor
    espressif/qrcode
    espressif/esp-sr
    espressif/libsodium
    espressif/esp-modbus
    chmorgan/esp-libhelix-mp3
; ============================================================================
;  BENCH env (15 Oct 2026). Same as favilla_key_pm plus the serial bench
;  probes (FAVILLA_BENCH_PROBES): bst, recover wipe, g0 wipekeys-raw,
;  se pinlock, pin fails, se anondel spend, g0 sessiontest. NEVER ship or
;  sign a release from this env. The default env compiles none of them.
;    pio run -e favilla_key_bench -t upload
; ============================================================================
; ============================================================================
;  RELEASE env (19 Oct 2026). Same as favilla_key_pm (light-sleep core, the
;  shipping core from 19 Oct 2026) plus FAVILLA_RELEASE, which turns off the raw
;  entropy dump tools and makes the compile FAIL if any bench / test-only switch
;  is on (see the release guard near the top of main.cpp). Build every image
;  that leaves the bench from THIS env:
;    pio run -e favilla_key_release
;  PINNING: the PM core is rebuilt locally, so release hashes need the lib
;  builder pinned as well (PINNING.md, to do) before any published-hash claim.
; ============================================================================
[env:favilla_key_release]
extends = env:favilla_key_pm
build_flags =
    ${env:favilla_key.build_flags}
    -DFAVILLA_RELEASE=1

; ============================================================================
;  RF TEST env (20 Oct 2026). The release build plus one extra page under
;  Settings > Device > "RF test" for the EMC lab (Spectra, 23 Oct 2026):
;  continuous modulated transmit on a fixed channel/rate at the production
;  8.5 dBm cap through the production radio path, and a receive-only mode.
;  Same core, same sdkconfig, no certification-mode PHY. Flash this on the
;  "continuous transmission" unit only; the "normal operation" unit runs
;  favilla_key_release.
;    pio run -e favilla_key_rftest -t upload
; ============================================================================
[env:favilla_key_rftest]
extends = env:favilla_key_pm
build_flags =
    ${env:favilla_key.build_flags}
    -DFAVILLA_RELEASE=1
    -DFAVILLA_RF_TEST=1

[env:favilla_key_bench]
extends = env:favilla_key_pm
build_flags =
    ${env:favilla_key.build_flags}
    -DFAVILLA_BENCH_PROBES

; ============================================================================
;  FIDO env (29-30 Oct 2026) — passkey door step 1. A FIDO security-key
;  interface that answers CTAP2 getInfo only (src/fido_hid.h), plus the bench
;  probes. USB moves from the USB-Serial/JTAG controller to the OTG controller
;  (TinyUSB, ARDUINO_USB_MODE=0) because only OTG can present a HID device; the
;  serial console stays up as a TinyUSB CDC port next to the HID interface.
;
;  WHY THE STOCK CORE, AND WHY ITS OWN PACKAGES FOLDER:
;  The light-sleep core (custom_sdkconfig hybrid rebuild) comes out with NO
;  TinyUSB at all, even with CONFIG_TINYUSB_*=y in its custom_sdkconfig
;  (checked 30 Oct 2026: sdkconfig.h in esp32s3/qio_opi has no TINYUSB line
;  after the rebuild; the stock 3.3.3 libs have all of them = 1). So this env
;  uses the stock prebuilt core (env:favilla_key, no light sleep). But the
;  stock and rebuilt cores share ONE libs package, and switching between them
;  in the same packages folder half-swapped it (29 Oct 2026: esp32s3 vanished).
;  So build this env ONLY with its own PlatformIO core folder, from a terminal:
;    $env:PLATFORMIO_CORE_DIR = "C:\pio-fido"
;    pio run -e favilla_key_fido -t upload
;    Remove-Item Env:PLATFORMIO_CORE_DIR
;  Never build it from the VS Code toolbar (that uses the default folder).
;  If an upload ever fails to reset the chip into the bootloader, hold the
;  KEY's boot strap at power-on and flash again (the ROM bootloader always
;  comes up on USB-Serial/JTAG), then flash favilla_key_bench to go back.
;  NEVER ship or sign from this env.
; ============================================================================
[env:favilla_key_fido]
extends = env:favilla_key
build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1
build_flags =
    ${env:favilla_key.build_flags}
    -DFAVILLA_BENCH_PROBES
    -DARDUINO_USB_MODE=0
    -DFAVILLA_FIDO_PROBE
    -DFAVILLA_PASSKEY_DOOR
    -DFAVILLA_PK_RESTORABLE      ; 30 Oct 2026: restorable passkeys (G0 PKSIGN); bench commands only so far
    -DFAVILLA_BLE_KBD            ; 4 Nov 2026 (Vault phase 6): Bluetooth keyboard, PASSKEY life only, setting off by default
    -Wl,--wrap=esp_bt_controller_init   ; its one choke point (main.cpp __wrap_esp_bt_controller_init)
    -Wl,--wrap=ble_gap_adv_start        ; repeat pairing ignored outside PAIR A PHONE (ble_kbd.h __wrap_ble_gap_adv_start)
    -Wl,--wrap=esp_panic_handler        ; 8c: turns on the Arduino core's own panic hook (it was never linked in), so a crash is noted for the next boot

; ============================================================================
;  FIDO + LIGHT SLEEP env (9n, 8 Nov 2026). favilla_key_fido on a rebuilt core
;  with automatic light sleep AND Bluetooth modem sleep, for the PASSKEY and
;  NOSTR Bluetooth lives (dimmed: ~60 mA on the stock core, where neither the
;  chip nor the radio ever sleeps).
;
;  WHY IT NOW BUILDS: the hybrid compile dropped TinyUSB because the lib
;  builder's arduino_tinyusb component is not in pioarduino's build_lib; it is
;  now vendored in components/arduino_tinyusb (pinned, see its README_FAVILLA.md),
;  which ESP-IDF picks up in that compile.
;
;  Bluetooth sleep clock: this board has no 32 kHz crystal (GPIO15/16 carry the
;  display). The internal 136 kHz RC is too inaccurate to hold a connection
;  (ESP-IDF's own warning), so the controller times its sleeps from the main
;  40 MHz crystal, kept powered during light sleep (MAIN_XTAL_PU). Without
;  MAIN_XTAL_PU the controller holds a no-light-sleep lock and nothing naps.
;
;  NO SECURE BOOT in this core (unlike favilla_key_pm): it is flashed straight
;  to the bench board with -t upload, bootloader included, and a Secure Boot
;  bootloader must never reach a board that way. Never flash it to a Secure
;  Boot board; never ship or sign from it.
;
;  OWN PlatformIO folder, because a hybrid compile rewrites the shared libs
;  package (the half-swap of 29 Oct 2026). Not C:\pio-fido (the stock core):
;    $env:PLATFORMIO_CORE_DIR = "C:\pio-fido-pm"
;    C:\pio-fido\penv\Scripts\pio.exe run -e favilla_key_fido_pm -t upload
;  First build: downloads the platform again and rebuilds the core (10-20 min).
; ============================================================================
[env:favilla_key_fido_pm]
extends = env:favilla_key_fido
; The board file's extra_flags carry -DARDUINO_USB_MODE=1. The core rebuild
; clears build_unflags but keeps build_flags, so it saw =1 AND =0 and the IDF
; parts built with -Werror (wpa_supplicant) failed "ARDUINO_USB_MODE
; redefined" (CI, 8 Nov 2026). The board's list again, without that one flag.
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
custom_sdkconfig =
    CONFIG_ESP_COREDUMP_ENABLE_TO_NONE=y
    CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=n
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
    CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=n
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
    CONFIG_TINYUSB_ENABLED=y
    CONFIG_TINYUSB_CDC_ENABLED=y
    CONFIG_TINYUSB_CDC_MAX_PORTS=2
; 24 Nov 2026: reproducible core rebuild. ESP-IDF maps its own, the project's
; and the build folder's paths in all compiled code, assembly included (ten
; .S files carried C:\repro\core-a style paths into the ELF, whose SHA-256
; the app descriptor holds). It also drops the build date from the app
; descriptor; the firmware reads only app_elf_sha256 from it.
    CONFIG_APP_REPRODUCIBLE_BUILD=y
    CONFIG_TINYUSB_HID_ENABLED=y
    CONFIG_TINYUSB_VENDOR_ENABLED=y
    CONFIG_PM_ENABLE=y
    CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
    CONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=3
    ; 10c (9 Nov 2026): OFF here. The NOSTR Wi-Fi life on this build ran with 250 to
    ; 700 bytes of internal RAM free (the 36 KB camera block is held from boot),
    ; and crashed: Wi-Fi's modem sleep re-enables the PHY on every wake, which
    ; creates an esp_timer (internal RAM only), and with none left
    ; phy_track_pll_init hit ESP_ERROR_CHECK and aborted (backtrace pm_dream ->
    ; esp_phy_enable -> phy_track_pll_init). Powering the CPU down in light sleep
    ; needs a retention buffer in internal RAM for the CPU and cache state; this
    ; build keeps the CPU powered instead, for a little more sleep current.
    CONFIG_PM_POWER_DOWN_CPU_IN_LIGHT_SLEEP=n
    CONFIG_ESP_SLEEP_PSRAM_LEAKAGE_WORKAROUND=y
    CONFIG_ESP_SLEEP_FLASH_LEAKAGE_WORKAROUND=y
    CONFIG_ESP_SLEEP_GPIO_RESET_WORKAROUND=y
    CONFIG_PM_SLP_IRAM_OPT=n
    CONFIG_PM_RTOS_IDLE_OPT=n
    CONFIG_ESP_WIFI_SLP_IRAM_OPT=n
    CONFIG_PM_PROFILING=n
    CONFIG_ESP_PHY_MAC_BB_PD=n
    CONFIG_BT_CTRL_MODEM_SLEEP=y
    CONFIG_BT_CTRL_MODEM_SLEEP_MODE_1=y
    CONFIG_BT_CTRL_LPCLK_SEL_MAIN_XTAL=y
    CONFIG_BT_CTRL_MAIN_XTAL_PU_DURING_LIGHT_SLEEP=y
    ; 9s (8 Nov 2026): the NOSTR Bluetooth life ran on 3 to 8 KB of internal
    ; RAM, and a 7-notification answer reached the phone as its first packet
    ; only. The stock core's controller takes each ACL transmit buffer from
    ; the heap "before TX and free[s it] after TX" (ESP-IDF Kconfig help), so
    ; with no room a queued packet never goes out. Here: 12 buffers taken once
    ; at controller start (the most it allows), and the NimBLE host's own
    ; memory in PSRAM, which hands back tens of KB of internal RAM.
    CONFIG_BT_CTRL_BLE_STATIC_ACL_TX_BUF_NB=12
    CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
    ; 9w: the power census (pm on the console): light-sleep exit callbacks
    ; count the naps, PM profiling times the locks in esp_pm_dump_locks.
    CONFIG_PM_LIGHT_SLEEP_CALLBACKS=y
    CONFIG_PM_PROFILING=y
    ; 11cn (22 Nov 2026): the dark census counts how often each esp_timer fired
    ; (the Bluetooth life napped 900 times a second, every wake a timer).
    CONFIG_ESP_TIMER_PROFILING=y
    ; 10n (9 Nov 2026): NVS keeps an index entry in RAM for every stored item,
    ; each a small allocation, so they all landed in internal RAM. Mounting
    ; the vault (108 passwords) took internal free from 13,368 to 5,048 bytes,
    ; and after it the phone's requests stopped reaching the KEY (no home-screen
    ; icon, white screen on launch). The index now lives in PSRAM.
    CONFIG_NVS_ALLOCATE_CACHE_IN_SPIRAM=y
    ; 10z (9 Nov 2026): the camera driver, built in this core (see
    ; custom_component_add below) with the standard core's settings.
    CONFIG_OV2640_SUPPORT=y
    CONFIG_CAMERA_CORE0=y
    CONFIG_CAMERA_TASK_STACK_SIZE=4096
    CONFIG_CAMERA_DMA_BUFFER_SIZE_MAX=16384   ; 11c: half the standard 32 KB, so a Bluetooth life can still start the camera
    CONFIG_SCCB_HARDWARE_I2C_DRIVER_NEW=y
    CONFIG_SCCB_HARDWARE_I2C_PORT1=y
    CONFIG_SCCB_CLK_FREQ=100000
; 10z (9 Nov 2026): the light-sleep build's camera ran 20-40x slow (bench: the
; sensor sent 26 frames a second, the driver handed over one every 5-8 s). The
; camera driver was never part of this core's rebuild: Espressif's lib builder
; adds espressif/esp32-camera from its own main/idf_component.yml, but the
; Arduino core's idf_component.yml (the list pioarduino's hybrid compile
; builds) does not name it. So this core linked the standard core's prebuilt
; libespressif__esp32-camera.a (byte-identical, 4 Nov 2025) - compiled against
; the standard configuration - with ESP-IDF libraries rebuilt for power
; management. Here the driver is built with the rest. 2.1.4 is the release
; nearest the standard core's prebuilt copy (built 4 Nov 2025 from master).
custom_component_add =
    espressif/esp32-camera@2.1.4
extra_scripts =
    pre:scripts/build_epoch.py
    pre:scripts/pin_hybrid.py
    post:scripts/hybrid_sections_ld.py
    post:scripts/guard_real_app.py
custom_component_remove =
    espressif/esp_hosted
    espressif/esp_wifi_remote
    espressif/esp-dsp
    espressif/network_provisioning
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/cbor
    espressif/qrcode
    espressif/esp-sr
    espressif/libsodium
    espressif/esp-modbus
    chmorgan/esp-libhelix-mp3

; ============================================================================
;  favilla_key_fido_pmx - TEST ONLY (10z+, 9 Nov 2026). The light-sleep build
;  exactly, with power management compiled OUT (PM_ENABLE=n, TICKLESS_IDLE=n).
;  Answers one question: is the slow camera caused by power management, or by
;  something else in the rebuilt core? Use its own core folder so the
;  light-sleep core is not rebuilt:  $env:PLATFORMIO_CORE_DIR="C:\pio-fido-pmx"
; ============================================================================
; ============================================================================
;  FIDO RELEASE env (12 Nov 2026). The vault, passkeys, the app channel and
;  the Bluetooth keyboard on the light-sleep core, with FAVILLA_RELEASE and
;  WITHOUT the bench probes, the USB log channel or the serial console. This
;  is the image a dev unit should carry; until now every build with the vault
;  in it was a bench build. First build is a core rebuild (same custom
;  sdkconfig as favilla_key_fido_pm, so the pm core is reused if it is there).
;    $env:PLATFORMIO_CORE_DIR="C:\pio-fido-pm"
;    pio run -e favilla_key_fido_release
