;  any vault path still leans on FAVILLA_BENCH_PROBES.
; ============================================================================
[env:favilla_key_fido_release]
extends = env:favilla_key_fido_pm
; strip_for_hash.py: the image carries the stripped ELF's hash, the same on
; Windows and Linux (25 Nov 2026). firmware.debug.elf keeps the debug info.
extra_scripts =
    ${env:favilla_key_fido_pm.extra_scripts}
    post:scripts/strip_for_hash.py
; 25 Nov 2026 (issue #74): USB = FIDO, the Favilla channel, keyboard, as the
; pmv build. The channel takes the serial port's place (the S3 has room for
; one or the other): the browser extension works on shipped KEYs, the Forge
; reads the device key over it (ATT), and `wdt last` is its WDT request. No
; console at all on a release image (no USB serial, the UART is not read).
build_flags =
    ${common.base_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DFAVILLA_VCHAN
    -DFAVILLA_RELEASE=1
    -DARDUINO_USB_MODE=0
    -DFAVILLA_FIDO_PROBE
    -DFAVILLA_PASSKEY_DOOR
    -DFAVILLA_PK_RESTORABLE
    -DFAVILLA_BLE_KBD
    -Wl,--wrap=esp_bt_controller_init
    -Wl,--wrap=ble_gap_adv_start
    -Wl,--wrap=esp_panic_handler

; ============================================================================
;  BLUETOOTH LAB env (15 Nov 2026, for Spectra EMC Lab: AS/NZS 4268 scans and
;  CISPR 32 checks with Bluetooth on). favilla_key_fido_release plus
;  FAVILLA_RF_TEST: the RF test page (Wi-Fi rows and BLE transmit rows at
;  2402 / 2440 / 2480 MHz) and the EMC tests page (modes A to G, F = BLE
;  advertising held at the fast interval, G = F plus Wi-Fi traffic) sit
;  alongside the vault, passkeys and Bluetooth. In this build only, those
;  pages may start Bluetooth in a NOSTR Wi-Fi life (one restart arms it), and
;  the BLE transmit power is set to +9 dBm explicitly and read back. The
;  release envs are unchanged. Flash on the lab's units only; never ship it.
;    $env:PLATFORMIO_CORE_DIR="C:\pio-fido-pm"
;    pio run -e favilla_key_fido_rftest
